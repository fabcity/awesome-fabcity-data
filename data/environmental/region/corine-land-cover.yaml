notes: |
  VERIFIED 2026-11-21.

  LICENCE. land.copernicus.eu: "Users are free to copy, distribute, transmit, and adapt the CLMS data as
  long as the data source is given credit", for "any public or commercial organisation". The data
  policy cites Delegated Regulation (EU) No 1159/2013. Conditions: credit the source, say whether the
  data were modified, and do not imply EU endorsement.

  ENDPOINT. Two paths. (1) Full downloads and the CLMS API need a free EU Login account (machine tokens
  at /en/how-to-guides/how-to-download-spatial-data/how-to-create-api-tokens). CLC+ Backbone 2023 is
  downloaded through WEkEO, which also needs an account. (2) EEA's public ArcGIS REST service answers
  `identify` with no login: image.discomap.eea.europa.eu/arcgis/rest/services/Corine/ lists CLC 1990 to
  2018 and the change layers. `auth: none` describes path 2.

  READ 2026-11-21 through CLC2018_WM identify. Plaça de Catalunya (41.3870 N 2.1700 E): code 111,
  continuous urban fabric, in a polygon of 3,719.7 ha. Collserola (41.4200 N 2.1050 E): 312,
  coniferous forest, polygon 6,092.6 ha. Off the Barceloneta (41.3600 N 2.1900 E): 523, sea and ocean.

  COVERAGE. EEA39 only (CLC 2018); CLC+ Backbone is EEA38 plus the UK. Nothing outside Europe: Bali,
  Santiago and Boston have no data. CLC 2018 (version 2020_20u1) is the latest. The 2024 update is
  "scheduled for publication in Q1 2027". Anything labelled CLC 2024 before then is premature.

  WHY THIS CELL. Environmental|Region asks for land under each land-use class in km2. CORINE is the
  European source built for exactly that, with a nomenclature (agriculture, forest, artificial
  surfaces) that answers land use rather than only cover.
  WHAT IT DOES NOT CLAIM. A 25 ha minimum unit merges everything smaller: a park inside urban fabric is
  urban fabric. Classes come from photo-interpretation, not a cadastre, so a class area is not tenure.
  A review should sum the classes inside one NUTS region and compare with ESA WorldCover.
