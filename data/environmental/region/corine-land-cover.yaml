description: |
  Europe's reference land-cover inventory: 44 classes, 25 ha minimum mapping unit, for 1990 to 2018
  plus change layers. CLC+ Backbone adds a 10 m raster with 11 classes for 2018, 2021 and 2023. Run by the EEA.
