name: Copernicus Climate Pulse (daily ERA5 global temperature and Niño indices)
url: https://pulse.climate.copernicus.eu/
description: |
  Daily global 2 m air temperature from 1940 and sea surface temperature from 1979 (60S-60N ocean and the
  Niño 1+2, 3, 3.4 and 4 boxes), from the ERA5 reanalysis, two days behind real time. Each chart downloads
  as a CSV with the 1991-2020 climatology and anomaly.
