name: Ember Yearly Electricity Data (generation, capacity, emissions and demand by country)
url: https://ember-energy.org/data/yearly-electricity-data/
description: |
  Yearly electricity generation, capacity, emissions and demand for over 200 geographies, from 2000, one row
  per area, year and electricity source (fuels, aggregates such as Fossil, and demand).
