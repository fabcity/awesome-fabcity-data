notes: |
  LICENCE VERIFIED 2026-09-20 from the repository's own CONTENT-LICENSE.md: code
  MIT, and "All content, data and documentation — the curated solutions in data/,
  the translations ... are licensed under Creative Commons Attribution-ShareAlike
  4.0 International". The same file names third-party assets that keep their own
  terms, including the 3D-printable splint files by Ostec3D. This is one of the
  few entries in this list whose licence needed no chasing.

  `api: null` — AND THAT IS THE GAP. Checked in this session: ttw.fab.city serves
  the built HTML and nothing machine-readable. /data.json, /dataset.json,
  /index.json and /api/solutions all return 404. The repository builds a
  dist/data.json and does not publish it. Until that file is served, a node can
  link a person to the site but cannot read it, which is the difference between an
  act source and a bookmark. Publishing the file that is already built is the
  smallest unblocking change in this list.

  WHAT IT CARRIES, measured from the repo on 2026-09-20: 2,853 records across
  Appropedia (2,565), Field Ready (193), OLIVE, MSF, the Cuban manuals and Whole
  Earth. So it is partly an aggregator of sources filed separately here — which is
  a feature, not duplication: it is the layer that has read them and said which
  ones work.

  TWO THINGS TO KNOW BEFORE BUILDING ON IT. The `domain` field is documented in
  SCHEMA.md as an enum array; in the data 2,551 of 2,853 records store it as a
  bare string and 224 omit it, so a reader must handle both. And there is no
  air-quality domain: counted with word boundaries, 23 records touch air quality
  against 499 for water and 260 for power. Strong where a node reads a portal or a
  heat cell, thin on the thing a node measures best.

  No `adapter`: nothing in planetai-node reads it yet, and nothing can until the
  dataset is published.
