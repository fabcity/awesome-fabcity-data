notes: |
  VERIFIED 2026-11-21.

  LICENCE. mobilitydatabase.org/terms-and-conditions (updated 23 Jan 2024): "All metadata generated by
  MobilityData is licensed under CC0 1.0 Universal" and "Content within the feeds is licensed by their
  respective data owners." The Apache-2.0 on the API and catalogs repos is a code licence. So the
  catalogue passes, and each feed passes only when its own `urls.license` names an open licence. 3,107
  of the 8,000 feeds have that field empty, and others point at agency or vendor terms (Bird's GBFS
  agreement, bctransit.com, goswift.ly).

  ENDPOINT. files.mobilitydatabase.org/feeds_v2.csv downloads with no login (`auth: none` describes this
  path). The REST API needs a registered account and a refresh token. Some feeds also want the agency's
  own key (`urls.authentication_type` 1 to 3).

  READ 2026-11-21, feeds_v2.csv: 8,000 rows (4,709 GTFS, 2,017 GTFS-RT, 1,274 GBFS). Spain, matching
  "barcelona": 20 feeds. Bicing, Cooltra and Getaround GBFS are CC BY 4.0, and Donkey Republic is CC0.
  Bird points at its own GBFS data agreement. The active AMB and TRAM GTFS feeds have an empty licence
  field, so they do not pass from this catalogue. FGC points at its open-data portal. The TMB GTFS
  entry is marked deprecated. Indonesia: 6 feeds in the whole country, and the only one for Bali is an
  inactive Ubud shuttle. Bali has no usable transit data here.

  WHY NO CELL. No cell's minimum indicators ask for transit access today ("access to services" is a
  Social|City category, not a row). It is filed for the node's Place door: stops and docks near a cell,
  feed by feed.
  WHAT IT DOES NOT CLAIM. A catalogue, not the data. A listed feed is not a licensed feed, and a feed's
  schedule is not service actually run.
