# The fourteen readings the Fab City Index asks of a city, R1 to R14.
#
# This file is the source of record. The readings and their meaning come from the position paper
# "What the Fab City Index measures and why" (November 2026), and the request itself from the data
# track design of 23 November 2026, section 5. index.json carries them as `readings`; the city-data
# page on index.fab.city and the Airtable `Readings` table copy them from here, one way.
#
# `plain`, `why`, `held_by` and `not_held` are public text, in English and, under `es:`, in Spanish. `prompt`
# is the brief a person gives an AI agent; the page fills {place_name}, {place_slug}, {years},
# {reading_name} and {unit}. An id never changes once a city has answered it.
# Schema: schema/reading.schema.json. Checked by scripts/validate.py, pass 4.

readings:
- id: R1
  name: Waste generated, and the share collected separately
  plain: How many tonnes of waste the city generated each year, and what share of it was collected separately
    for recycling or composting.
  why: In a Fab City the tonnes of waste going out have to fall, and this figure shows whether they do.
  unit: t/yr and %
  years: [2023, 2024, 2025]
  held_by: City waste department
  tests: PITO
  cells: [Environmental|City]
  not_held: Tell us which department you asked and what they said. If only a regional figure exists, send
    it and tell us it is regional.
  prompt: |
    Look for an open source for {reading_name} in {place_name}, for {years}, in {unit}. This is reading R1 of the Fab City Index. It usually sits with the city's waste department. Show me what you find and the evidence, and file nothing yourself.

    Read https://index.fab.city/api/v0/places/{place_slug}.json for the place, and https://raw.githubusercontent.com/fabcity/awesome-fabcity-data/main/index.json for the sources the registry already holds, so you do not send one it has.

    1. Search for a dataset that holds this figure for {place_name}. Prefer the publisher's own site or API.
    2. Read the licence or terms on the publisher's own page. Quote the URL and the sentence that says what may be done with the data. If the terms are not open, say so and quote them, since a public source can still be cited with its terms.
    3. Fetch the data and check that it holds figures for {place_name} itself, for {years}. Write down the place's official name or code as the data gives it, and two or three real figures with their year. Never invent a figure. If you could not read something, say so.
    4. Write it in exactly this shape, one answer under each heading, with yourself in Assisted by. If the terms are not open, add cited-figure to Tags.

    ### Name
    ### Home URL
    ### API or download URL
    ### Description
    <one or two sentences, under 320 characters>
    ### Cell
    Environmental|City
    ### Licence
    <as the publisher states it, or: not stated>
    ### Authentication
    <none | key-free-rate-limited | api-key | registration | paid>
    ### Places
    {place_slug}
    ### Tags
    city-sent, reading-r1
    ### Assisted by
    <your name, e.g. Claude>
    ### Notes
    VERIFIED: <date, and what you opened>
    LICENCE: <URL and the sentence that says what may be done with the data>
    ENDPOINT: <URL, what it returned, two or three real figures with their year>
    WHY THIS CELL: reading R1, <what the figure measures>
    WHAT IT DOES NOT CLAIM: <the limits>

    Reply with that and nothing after it. I paste it into https://index.fab.city/operate/add-source and send it in my name. I am responsible for what you file; you do the research.
  es:
    name: Residuos generados, y la parte recogida por separado
    held_by: Departamento de residuos de la ciudad
    plain: Cuántas toneladas de residuos generó la ciudad cada año, y qué parte se recogió por separado
      para reciclar o compostar.
    why: En una Fab City las toneladas de residuos que salen tienen que bajar, y esta cifra muestra si
      bajan.
    not_held: Cuéntanos a qué departamento preguntaste y qué te respondieron. Si solo existe una cifra
      regional, mándala y dinos que es regional.
