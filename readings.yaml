    by activity is the closest open record of that.
  unit: count per code
  years: [2023, 2024, 2025]
  held_by: Business register, statistics office
  tests: DIDO
  cells: [Economic|City, Economic|Region]
  not_held: If the register publishes only broad groups, send those and tell us the level. If it publishes
