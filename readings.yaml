  es:
    name: Energía usada en la ciudad, y la parte producida dentro de la ciudad o de su región
    held_by: Oficina de energía de la ciudad, balance energético regional
    plain: Cuánta energía usó la ciudad cada año, en megavatios hora, y qué parte se produjo dentro de
      la ciudad o de su región.
    why: El Índice lee cada sector en su propia unidad, y en energía pregunta cuánto de lo que usa la
      ciudad viene de fuera de la ciudad y de su región.
    not_held: Si la ciudad no cuenta su propio consumo de energía, muchas veces la región sí lo hace,
      así que manda la cifra de la región y márcala como regional. Si ninguna lo cuenta, dinos a quién
      preguntaste.
