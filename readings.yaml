  es:
    name: Material usado por la región (consumo doméstico de materiales), donde exista una cuenta regional
    held_by: Oficina regional de estadística
    plain: Cuántas toneladas de material usa la región por persona cada año, contando lo que extrae más
      lo que trae de fuera, menos lo que manda fuera.
    why: Una Fab City tiene que traer menos material recién extraído, y la cuenta de materiales de la
      región suele ser el único lugar donde eso ya se cuenta.
    not_held: Muchas regiones no tienen cuenta de materiales, y queremos saber cuáles sí. Dinos si la
      tuya no la tiene, y manda la cifra nacional si es la más cercana.
