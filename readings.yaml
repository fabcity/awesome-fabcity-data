  es:
    name: Alimentos que entran a la ciudad por sus mercados mayoristas, y la parte que viene de la región
    held_by: Operador del mercado mayorista, oficina regional de agricultura
    plain: Cuántas toneladas de alimentos entraron a la ciudad por sus mercados mayoristas en un año,
      y qué parte vino de la región.
    why: La comida es algo que todos necesitamos cada día, y la parte que viene de la región muestra cuánto
