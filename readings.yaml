    comes from outside the city and its region.
  unit: MWh/yr and %
  years: [2023, 2024, 2025]
  held_by: City energy office, regional energy balance
  tests: PITO
  cells: [Environmental|City, Environmental|Region]
  not_held: If the city does not count its own energy use, the region often does, so send the region's
    figure and mark it as regional. If neither counts it, tell us who you asked.
