    machines no longer has to import its tools.
  unit: count
  years: latest
  held_by: The lead and the lab network
  tests: DIDO
  cells: [Economic|Community, Economic|City]
  not_held: The Fab City lead in your city can ask the labs directly, and a count from the labs that answered
    is fine if you tell us how many you asked.
