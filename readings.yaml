  es:
    name: Importaciones y exportaciones de la región por tipo (bienes terminados, materiales y piezas,
      equipos, conocimiento y servicios), por valor y, donde se registre, por peso
    held_by: Oficina regional de estadística, aduana
    plain: Lo que la región compra y vende fuera cada año, separado en bienes terminados, materiales y
      piezas, equipos, y conocimiento y servicios, por valor y por peso donde se cuente.
    why: Una Fab City sigue comerciando y cambia el tipo de cosas que trae, con menos bienes terminados
