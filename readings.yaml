- id: R4
  name: Material used by the region (domestic material consumption), where a regional account exists
  plain: How many tonnes of material the region uses per person each year, counted as what it extracts
    plus what it brings in, minus what it sends out.
  why: A Fab City has to take in less newly extracted material, and the region's material account is often
    the only place where that is already counted.
  unit: t/person/yr
  years: [2023, 2024, 2025]
  held_by: Regional statistics office
  tests: PITO
  cells: [Environmental|Region, Economic|Bioregion]
  not_held: Many regions have no material account, and we want to know which ones do. Tell us if yours
    has none, and send the national figure if that is the closest one.
