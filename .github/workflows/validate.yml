name: Validate dataset entries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation deps
        run: pip install -r requirements.txt

      - name: Schema tests (the cases that must fail)
        run: python tests/test_schema.py

      # The only code here that writes to data/. Its selftest covers the issue-body parse, the
      # filename collision suffix and the one-line promotion, and asserts that the labels it looks
      # for still exist in .github/ISSUE_TEMPLATE/source-review.yml.
      - name: Review-from-issue selftest
        run: python scripts/review_from_issue.py --selftest

      - name: Validate entries against schema
        run: python scripts/validate.py

      # A review is evidence about a source at a moment. Past 365 days this warns; past 730 it
      # fails, and prints the exact `status:` line to flip back to `candidate`. Entries standing on
      # an `adapter` are not failed — the code is the evidence there, and wired.py checks it
      # resolves. Zero reviews exist today, so this is a no-op until the first one lands.
      - name: Reviews have not decayed past two years
        run: python scripts/check_review.py

      # index.json is the whole registry as one file, because a browser fetching 257 YAMLs to
      # find twelve candidates is a rate limit, not a page. --check ignores only `generated`,
      # which is a date and would otherwise fail every day for no reason.
      - name: Verify index.json is up to date
        run: python scripts/build_index.py --check

      - name: Verify README is up to date
        run: |
          python scripts/build_readme.py
          if ! git diff --quiet -- README.md; then
            echo "::error::README.md is out of sync with data/. Run 'python scripts/build_readme.py' locally and commit."
            git --no-pager diff README.md | head -200
            exit 1
          fi

      # The node declares what it reads. `wired_in_planetai` is typed by hand here, so the two drift;
      # this fails only on the half that is checkable — a pack reads a source and its entry says
      # otherwise. The other half is printed, see scripts/wired.py. `adapter`, which replaces that
      # boolean, is checkable in both directions and the same step fails on a dangling one.
      - name: Check out planetai-node (public) to read what its packs declare
        uses: actions/checkout@v5
        with:
          repository: fabcity/planetai-node
          path: .planetai-node
          fetch-depth: 0

      - name: wired_in_planetai agrees with the node's packs
        env:
          PLANETAI_NODE_REPO: .planetai-node
        run: python scripts/wired.py --check
