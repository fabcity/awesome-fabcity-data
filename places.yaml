# The 61 Fab City places the Index tracks, one per locality in Airtable's FCI Coverage Tracker
# (the source of record for the list). An entry's `places` must use these slugs. Snapshot taken
# 2026-09-27 from index.fab.city/api/coverage.json; add a place here when the tracker gains one.
#
# `nuts2` / `nuts3` (NUTS 2024, from Eurostat's GISCO code list, read 2026-10-13): the statistical region a
# European place sits in, which is what a Eurostat regional table needs. `+` joins the units a place spans.
# `kind`: traits that say whether a national figure may be split down to the place. fci-index's downscaling
# check (compute/downscale.py) found a national key reproduces a region that makes things to within a fifth,
# and fails by 2-5x for a seaport (a port's customs trade lands for the whole country) and for a capital
# (customs attribute trade to head offices). Traits: `national-capital`, `seaport` (a seaport in the territory
# on the order of 10 Mt a year or more), `country` (a country row). An empty list means no trait found, not
# "checked and plain": `kind_note` says what was read and what was not.
places:
  - slug: accra
    name: "Accra"
    country: "Ghana"
    kind: [national-capital]
    kind_note: "national capital; Tema port is outside the territory"
  - slug: amsterdam
    name: "Amsterdam"
    country: "Netherlands"
    nuts2: NL32
    nuts3: NL32B
    kind: [national-capital, seaport]
    kind_note: "constitutional capital of the Netherlands (the government sits in The Hague); Port of Amsterdam, 78,756 thousand t in 2024 (Eurostat mar_mg_aa_pwhd, read 2026-10-13)"
