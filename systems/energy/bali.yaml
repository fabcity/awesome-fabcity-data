notes: The polygon covers the main island of Bali. Nusa Penida (115.43 to 115.63 E, 8.66 to 8.82 S) is an isolated
  island microgrid with no submarine link to Bali's 150 kV grid, and Ketapang (114.40 E, 8.15 S) is on the Java
  shore, so both sit outside it. Coal, gas and oil capacity factors come from Indonesia 2024 generation divided
  by capacity in Ember Yearly Electricity Data (CC BY 4.0); solar and wind are assumed from typical utility-scale
  factors. The fossil_share on the Java-Bali cable is Indonesia's 2025 fossil generation share (444.713 of 528.207
  TWh, 0.8419), used for Java. No open-licensed table stating the rated transfer of the 150 kV Ketapang-Gilimanuk
  cable was found, and none for Bali's average demand, so rated_mw and demand_mw are empty. Moved from planetai-node
  packs/energy/grids.yml on 2026-11-28.
